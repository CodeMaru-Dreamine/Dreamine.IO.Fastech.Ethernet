name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SONAR_PROJECT_KEY: CodeMaru-Dreamine_Dreamine.IO.Fastech.Ethernet
  SONAR_ORGANIZATION: codemaru-dreamine
  SONAR_PROJECT_VERSION: 1.0.1
  SONAR_SCANNER_VERSION: 11.2.1
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  build-test-analyze:
    name: Build, test, package, and analyze
    runs-on: windows-2025

    steps:
      - name: Check out adapter
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: src/IO.Fastech.Ethernet
          fetch-depth: 0

      - name: Check out public abstraction dependency
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: CodeMaru-Dreamine/Dreamine.IO.Abstractions
          path: src/IO.Abstractions

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x

      - name: Install SonarScanner
        if: env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: dotnet tool install --global dotnet-sonarscanner --version $env:SONAR_SCANNER_VERSION

      - name: Restore
        shell: pwsh
        run: dotnet restore src/IO.Fastech.Ethernet/tests/Dreamine.IO.Fastech.Ethernet.Tests/Dreamine.IO.Fastech.Ethernet.Tests.csproj

      - name: Begin Sonar analysis
        if: env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: >
          dotnet sonarscanner begin
          /k:"$env:SONAR_PROJECT_KEY"
          /o:"$env:SONAR_ORGANIZATION"
          /v:"$env:SONAR_PROJECT_VERSION"
          /d:sonar.token="$env:SONAR_TOKEN"
          /d:sonar.projectBaseDir="${{ github.workspace }}\src\IO.Fastech.Ethernet"
          /d:sonar.scm.provider=git
          /d:sonar.sourceEncoding=UTF-8
          /d:sonar.cs.opencover.reportsPaths="$env:RUNNER_TEMP\TestResults\**\coverage.opencover.xml"
          /d:sonar.cs.vstest.reportsPaths="$env:RUNNER_TEMP\TestResults\**\*.trx"
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/TestResults/**,**/*.png"
          /d:sonar.coverage.exclusions="tests/**"
          /d:sonar.cpd.exclusions="tests/**,Transport/UdpFastechEthernetIoTransport.cs"

      - name: Build and test
        shell: pwsh
        run: >
          dotnet test
          src/IO.Fastech.Ethernet/tests/Dreamine.IO.Fastech.Ethernet.Tests/Dreamine.IO.Fastech.Ethernet.Tests.csproj
          --no-restore
          --configuration Release
          -m:1
          --collect:"XPlat Code Coverage"
          --settings src/IO.Fastech.Ethernet/.github/coverlet.runsettings
          --results-directory "$env:RUNNER_TEMP\TestResults"
          --logger "trx;LogFileName=tests.trx"

      - name: Pack
        shell: pwsh
        run: >
          dotnet pack
          src/IO.Fastech.Ethernet/Dreamine.IO.Fastech.Ethernet.csproj
          --no-restore
          --configuration Release
          --output "$env:RUNNER_TEMP\packages"

      - name: End Sonar analysis
        if: success() && env.SONAR_TOKEN != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        shell: pwsh
        run: dotnet sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
